name: Test and Publish Task Tracker

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: task-tracker-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      POSTGRES_USER: ci_user
      POSTGRES_DB: ci_tasktracker
      POSTGRES_PASSWORD: temporary-ci-database-password
      SECRET_KEY: temporary-ci-only-secret-key-for-testing

    steps:
      - name: Download repository files
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build and start application
        run: docker compose up -d --build --wait --wait-timeout 180

      - name: Run automated tests
        run: docker compose exec -T web python -m unittest discover -s tests -v

      - name: Sign in to Docker Hub
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publish the tested image
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          IMAGE="${DOCKERHUB_USERNAME}/docker-compose-task-tracker"
          IMAGE_ID=$(docker compose images -q web)

          test -n "$IMAGE_ID"

          docker tag "$IMAGE_ID" "$IMAGE:latest"
          docker tag "$IMAGE_ID" "$IMAGE:sha-${GITHUB_SHA}"

          docker push "$IMAGE:sha-${GITHUB_SHA}"
          docker push "$IMAGE:latest"

      - name: Show logs if a step failed
        if: failure()
        run: docker compose logs --tail=100

      - name: Clean up temporary CI services
        if: always()
        run: docker compose down --volumes --remove-orphans