<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Task Tracker</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 24px;
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      color: #172033;
    }
    main {
      max-width: 760px;
      margin: 40px auto;
      padding: 28px;
      background: white;
      border-radius: 16px;
      box-shadow: 0 8px 30px #17203312;
    }
    h1 { margin-bottom: 8px; }
    .subtitle { color: #526078; }
    .add-form, .task, .actions {
      display: flex;
      gap: 12px;
      align-items: center;
    }
    .add-form { margin: 28px 0; }
    input[type="text"] {
      flex: 1;
      min-width: 0;
      padding: 12px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 16px;
    }
    button {
      padding: 11px 15px;
      border: 0;
      border-radius: 8px;
      background: #2563eb;
      color: white;
      cursor: pointer;
      font-size: 14px;
    }
    button:hover { filter: brightness(.9); }
    .task {
      justify-content: space-between;
      padding: 18px 0;
      border-bottom: 1px solid #e2e8f0;
    }
    .title { overflow-wrap: anywhere; }
    .completed { text-decoration: line-through; color: #64748b; }
    .delete { background: #b91c1c; }
    .empty { padding: 24px 0; color: #64748b; }
    @media (max-width: 600px) {
      body { padding: 12px; }
      main { margin: 16px auto; padding: 20px; }
      .add-form, .task { align-items: stretch; flex-direction: column; }
      .actions { flex-wrap: wrap; }
    }
  </style>
</head>
<body>
  <main>
    <h1>My Task Tracker</h1>
    <p class="subtitle">Built by Pavithira with Flask, PostgreSQL and Docker Compose.</p>

    <form class="add-form" action="{{ url_for('add_task') }}" method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <input type="text" name="title" placeholder="What do you need to do?"
             aria-label="New task" maxlength="200" required>
      <button type="submit">Add task</button>
    </form>

    {% for task in tasks %}
    <div class="task">
      <span class="title {% if task.completed %}completed{% endif %}">
        {{ task.title }}
      </span>
      <div class="actions">
        <form action="{{ url_for('toggle_task', task_id=task.id) }}" method="post">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <button type="submit">
            {{ 'Undo' if task.completed else 'Complete' }}
          </button>
        </form>
        <form action="{{ url_for('delete_task', task_id=task.id) }}" method="post">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <button class="delete" type="submit">Delete</button>
        </form>
      </div>
    </div>
    {% else %}
    <p class="empty">No tasks yet. Add your first task above.</p>
    {% endfor %}
  </main>
</body>
</html>
